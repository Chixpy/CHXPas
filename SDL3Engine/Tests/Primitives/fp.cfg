# FPC configuration for CHXSDL3Engine test programs
#
# YOU NEED TO PROVIDE SDL3-for-Pascal unit folder with
#   -Fu<SDL3-for-PascalDir>/units in CLI or changing this file
#
# Use "fpc @fp.cfg -dRELEASE -Fu<SDL3-for-Pascal>/units <file>" for optimized
# executable

# Unit and include search
# "*" means all subdirs, but not itself

# Subfolders
-Fu./*
# SDL3Engine folder
-Fu../../*
# CHXPas folder
-Fu../../../*
# Try SDL3 folder at same level of CHXPas...
-Fu../../../../SDL3/units

# Output directory for the executable (and .ppu/.o but overrided by -FU)
-FEbin

# lib dir (*.ppu, *.o)
-FUlib

# Verbosity
#      e : Show errors (default)       d : Show debug info
#      w : Show warnings               u : Show unit info
#      n : Show notes                  t : Show tried/used files
#      h : Show hints                  s : Show time stamps
#      i : Show general info           q : Show message numbers
#      l : Show linenumbers            c : Show conditionals
#      a : Show everything             0 : Show nothing (except errors)
#      b : Write file names messages   r : Rhide/GCC compatibility mode
#          with full path              x : Executable info (Win32 only)
#      v : write fpcdebug.txt with     p : Write tree.log with parse tree
#          lots of debugging info
#
# Display Info, Warnings and Notes
#-viwn
# If you don't want so much verbosity use
#-vw

# Compilation modes

#IFDEF RELEASE
  #WRITE === Compiling RELEASE Version ===
  # Optimization level 3
  -O3
  # Strip executable
  -Xs
  # Smartlinking
  -CX
  -XX
#ELSE
  #WRITE === Compiling DEBUG Version ===
  # Optimization level 1 (debug frienly)
  -O1
  # Use heap trace unit (for memory leak debugging)
  -gh
  # Use line info unit to show more info for backtraces
  -gl
  # IOCheck, Overflow, Range, Stack checks.
  -Ciort
#ENDIF

# Use {$mode ObjFPC} inside files
#-Mobjfpc

# Allow Goto, C-Operators, C-Vars.
-Scg

# Use {$H+} inside files.
#-Sh

# Inline: Activated always but recommended to use {$inline ON} inside files.
-Si


# Some random architecture dependant options from example fpc.cfg

#IFDEF DARWIN
  # Use pipes instead of temporary files for assembling
  -ap
  # Path to Xcode 4.3+ utilities (no problem if it doesn't exist)
  -FD/Applications/Xcode.app/Contents/Developer/usr/bin
#ENDIF

#IFDEF DARWIN
#IFDEF CPUI386
  -Cppentiumm
  -Oppentiumm
#ENDIF
#ENDIF

# Path to the gcclib
#ifdef cpui386
  -Fl/usr/lib/gcc/x86_64-linux-gnu/4.7
#endif
#ifdef cpux86_64
  -Fl/usr/lib/gcc/x86_64-linux-gnu/4.7
#endif

#IFNDEF CPUI386
#IFNDEF CPUAMD64
  #DEFINE NEEDCROSSBINUTILS
#ENDIF
#ENDIF

#IFNDEF Linux
  #DEFINE NEEDCROSSBINUTILS
#ENDIF

# Never need cross-prefix when targeting the JVM
# (no native compiler, always cross-compiling)
#ifdef cpujvm
  #undef NEEDCROSSBINUTILS
#endif

# Never need cross-prefix when targeting the i8086
# (no native compiler, always cross-compiling)
#ifdef cpui8086
  #undef NEEDCROSSBINUTILS
#endif

# binutils prefix for cross compiling
#IFDEF FPC_CROSSCOMPILING
#IFDEF NEEDCROSSBINUTILS
  -XP$FPCTARGET-
#ENDIF
#ENDIF

# Search path for unicode binary files (FPC 2.x does not know this switch)
#ifndef VER2
  -FM/unicode/
#endif

# Write FPC versión
-l
